<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poseidon Monitoring Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <!-- jQuery & DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
    
    <!-- ✅ TAMBAHAN BARU: html2canvas untuk screenshot -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e3a8a 100%);
            background-attachment: fixed;
            color: #e0f2fe;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass {
            background: rgba(30, 58, 138, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .glow-text { text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }
        .live-dot { animation: pulse-cyan 2s infinite; }
        .offline-dot { animation: pulse-red 2s infinite; }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .break-word { word-wrap: break-word; overflow-wrap: break-word; }
        
        /* Tab Styles */
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active {
            background: rgba(34, 211, 238, 0.2);
            border-color: rgba(34, 211, 238, 0.6);
            color: #22d3ee;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Sub-Tab Styles */
        .sub-tab-btn {
            transition: all 0.3s ease;
            font-size: 14px;
            padding: 8px 16px;
        }
        .sub-tab-btn.active {
            background: rgba(34, 211, 238, 0.3);
            border-color: rgba(34, 211, 238, 0.8);
            color: #22d3ee;
            font-weight: bold;
        }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block; }
        
        /* ✅ FULL WIDTH TABLE - TANPA SCROLL */
        .table-white-container {
            background: #ffffff !important;
            border-radius: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box;
            overflow-x: visible !important; /* ✅ TIDAK ADA SCROLL */
        }
        .table-white-container .dataTables_wrapper {
            color: #1e293b !important;
            width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow-x: visible !important; /* ✅ TIDAK ADA SCROLL */
        }
        .table-white-container .dataTables_length,
        .table-white-container .dataTables_filter,
        .table-white-container .dataTables_info,
        .table-white-container .dataTables_processing,
        .table-white-container .dataTables_paginate {
            color: #1e293b !important;
            padding: 10px !important;
        }
        .table-white-container .dataTables_filter {
            float: right !important;
            margin-bottom: 10px !important;
        }
        .table-white-container .dataTables_length {
            float: left !important;
            margin-bottom: 10px !important;
        }
        .table-white-container .dataTables_paginate .paginate_button {
            color: #1e293b !important;
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 4px !important;
            margin: 0 1px !important;
            padding: 4px 10px !important;
        }
        .table-white-container .dataTables_paginate .paginate_button.current,
        .table-white-container .dataTables_paginate .paginate_button:hover {
            background: #3b82f6 !important;
            color: #ffffff !important;
            border-color: #3b82f6 !important;
        }
        .table-white-container .dataTables_filter input {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #1e293b !important;
            border-radius: 4px;
            padding: 4px 8px;
            margin-left: 8px;
        }
        .table-white-container .dataTables_length select {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            color: #1e293b !important;
            border-radius: 4px;
            padding: 4px;
            margin: 0 4px;
        }
        
        /* ✅ TABLE - TANPA MIN-WIDTH, AUTO FIT */
        .table-white-container table.dataTable {
            border-collapse: collapse !important;
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            table-layout: auto !important;
        }
        .table-white-container table.dataTable thead th {
            background: #1e293b !important;
            color: #ffffff !important;
            border-bottom: 2px solid #334155 !important;
            font-size: 11px;
            padding: 10px 6px !important;
            white-space: nowrap;
            text-align: left;
            font-weight: 600;
        }
        .table-white-container table.dataTable tbody td {
            background: #ffffff !important;
            color: #1e293b !important;
            border-bottom: 1px solid #e2e8f0 !important;
            font-size: 11px;
            padding: 8px 6px !important;
            vertical-align: top;
            word-break: break-word; /* ✅ BOLEH WRAP JIKA PERLU */
            white-space: normal; /* ✅ NORMAL WRAP */
        }
        .table-white-container table.dataTable tbody tr:hover td {
            background: #f1f5f9 !important;
        }
        .table-white-container table.dataTable tbody tr:nth-child(even) td {
            background: #f8fafc !important;
        }
        .table-white-container table.dataTable tbody tr:nth-child(even):hover td {
            background: #f1f5f9 !important;
        }
        .table-white-container .dataTables_wrapper::after {
            content: "";
            display: table;
            clear: both;
        }
        
        /* Badge Styles */
        .ttr-low { background: #16a34a; color: white; padding: 3px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; display: inline-block; text-align: center; min-width: 40px;}
        .ttr-high { background: #dc2626; color: white; padding: 3px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; display: inline-block; text-align: center; min-width: 40px;}
        
        /* DataTables Buttons */
        .dt-button {
            background: rgba(30, 58, 138, 0.5) !important;
            color: #e0f2fe !important;
            border: 1px solid rgba(56, 189, 248, 0.4) !important;
            border-radius: 6px !important;
            padding: 6px 12px !important;
            font-size: 12px !important;
            margin-left: 4px !important;
            cursor: pointer;
        }
        .dt-button:hover { background: rgba(34, 211, 238, 0.3) !important; }
        
        /* Search Box */
        .search-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #e0f2fe;
            border-radius: 6px;
            padding: 8px 16px;
            width: 300px;
        }
        .search-box:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }
        
        /* ✅ CAPTURE MODAL STYLES */
        .capture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .capture-modal.active {
            display: flex;
        }
        .capture-modal-content {
            background: #0f172a;
            border-radius: 16px;
            padding: 24px;
            max-width: 90%;
            max-height: 90vh;
            overflow: auto;
            border: 2px solid rgba(34, 211, 238, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .capture-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }
        .capture-modal-title {
            color: #22d3ee;
            font-size: 18px;
            font-weight: bold;
        }
        .capture-modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .modal-btn-copy { background: #10b981; color: white; }
        .modal-btn-copy:hover { background: #059669; }
        .modal-btn-download { background: #3b82f6; color: white; }
        .modal-btn-download:hover { background: #2563eb; }
        .modal-btn-close { background: #ef4444; color: white; }
        .modal-btn-close:hover { background: #dc2626; }
        .capture-preview-img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(34, 211, 238, 0.2);
        }
        
        /* ✅ TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 10000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ef4444; }
        
        /* ✅ CAPTURE ICON BUTTON - DIPERBAIKI */
        .capture-icon-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            width: 48px;
            height: 48px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            line-height: 1;
        }
        .capture-icon-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.6);
        }
        .capture-icon-btn:active {
            transform: translateY(0) scale(0.95);
        }

        /* Capture main header */
        .capture-main-header {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Loading -->
    <div id="loading" class="flex justify-center items-center h-screen">
        <div class="text-cyan-400 text-xl animate-pulse">🌊 Menghubungkan ke Poseidon...</div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="hidden">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 glass p-5 rounded-2xl">
            <div class="flex items-center gap-3 mb-4 md:mb-0">
                <div id="connection-dot" class="w-3 h-3 bg-cyan-400 rounded-full live-dot"></div>
                <h1 class="text-3xl md:text-4xl font-bold text-cyan-300 glow-text tracking-widest">POSEIDON</h1>
            </div>
            <div class="text-right">
                <div id="realtime-clock" class="text-lg md:text-xl font-mono font-semibold text-cyan-100 bg-slate-900/60 px-5 py-2 rounded-xl border border-cyan-800/50">
                    Memuat Waktu...
                </div>
                <div id="connection-status" class="text-xs text-cyan-400/70 mt-2 font-mono flex items-center justify-end gap-2">
                    <span>🔄 Terakhir diperbarui:</span>
                    <span id="last-updated">Memuat...</span>
                </div>
            </div>
        </header>

        <!-- MAIN TAB NAVIGATION -->
        <div class="max-w-7xl mx-auto mb-6">
            <div class="flex gap-2 glass p-2 rounded-xl">
                <button class="tab-btn active flex-1 py-3 px-6 rounded-lg font-bold text-cyan-300 border border-cyan-700/30" data-tab="monitoring">
                     MONITORING
                </button>
                <button class="tab-btn flex-1 py-3 px-6 rounded-lg font-bold text-cyan-300/60 border border-cyan-700/30" data-tab="laporan">
                     LAPORAN CNOP
                </button>
            </div>
        </div>

        <!-- TAB 1: MONITORING -->
        <div id="tab-monitoring" class="tab-content active">
            <div class="max-w-7xl mx-auto mb-4 flex gap-2">
                <button class="sub-tab-btn active bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300" data-subtab="metro">METRO</button>
                <button class="sub-tab-btn bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300/60" data-subtab="radio">RADIO</button>
            </div>

            <div id="subtab-metro" class="sub-tab-content active">
                <div class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
                    <input type="text" id="search-metro" class="search-box" placeholder="🔍 Cari Site ID atau No Tiket...">
                </div>
                <main class="max-w-6xl mx-auto space-y-10" id="ticket-container-metro"></main>
            </div>

            <div id="subtab-radio" class="sub-tab-content">
                <div class="max-w-7xl mx-auto mb-4 flex justify-between items-center">
                    <input type="text" id="search-radio" class="search-box" placeholder="🔍 Cari Site ID atau No Tiket Radio...">
                </div>
                <main class="max-w-6xl mx-auto space-y-10" id="ticket-container-radio"></main>
            </div>
        </div>

        <!-- TAB 2: LAPORAN CNOP -->
        <div id="tab-laporan" class="tab-content">
            <div class="max-w-7xl mx-auto mb-4 flex flex-wrap gap-2">
                <button class="sub-tab-btn active bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300" data-area="JATIM">JATIM</button>
                <button class="sub-tab-btn bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300/60" data-area="MATARAM">MATARAM</button>
                <button class="sub-tab-btn bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300/60" data-area="FLORES">FLORES</button>
                <button class="sub-tab-btn bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300/60" data-area="KUPANG">KUPANG</button>
                <button class="sub-tab-btn bg-slate-900/40 border border-cyan-700/30 rounded-lg text-cyan-300/60" data-area="BALI">BALI</button>
            </div>

            <!-- ✅ WRAPPER UTAMA UNTUK CAPTURE (Kedua tabel dalam 1 container) -->
            <main class="max-w-7xl mx-auto space-y-10" id="capture-wrapper">
                
                <!-- ✅ Header Capture: HANYA WAKTU di KANAN -->
                <div class="capture-main-header" style="background: #0f172a; color: #22d3ee; padding: 20px; font-weight: bold; font-size: 20px; border-radius: 12px 12px 0 0; display: none;">
                    <div style="display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div style="font-size: 14px; font-weight: normal; opacity: 0.9;" class="capture-timestamp-inline"></div>
                    </div>
                </div>

                <!-- Tabel DOWN -->
                <section id="section-down">
                    <h2 class="text-2xl font-bold text-cyan-400 uppercase tracking-widest mb-4 text-center">
                        Tiket Gangguan CNOP <span id="label-area-down">(JATIM DOWN)</span>
                    </h2>
                    <div class="table-white-container">
                        <table id="table-down" class="w-full" style="width:100%"></table>
                    </div>
                </section>

                <!-- Tabel non-DOWN -->
                <section id="section-nondown">
                    <h2 class="text-2xl font-bold text-cyan-400 uppercase tracking-widest mb-4 text-center">
                        Tiket Gangguan CNOP (non-DOWN / CNQ)
                    </h2>
                    <div class="table-white-container">
                        <table id="table-nondown" class="w-full" style="width:100%"></table>
                    </div>
                </section>

                <!-- ✅ Footer DIHILANGKAN agar capture murni laporan -->
            </main>

            <!-- ✅ TOMBOL CAPTURE ICON (Di luar wrapper agar tidak ikut ter-capture) -->
            <div class="max-w-7xl mx-auto mt-6 mb-4 flex justify-end">
                <button class="capture-icon-btn" onclick="captureBothTables()" title="Capture Laporan">
                    📸
                </button>
            </div>
        </div>

        <!-- ✅ Footer Halaman DIHILANGKAN sesuai permintaan -->
    </div>

    <!-- ✅ CAPTURE MODAL -->
    <div id="capture-modal" class="capture-modal">
        <div class="capture-modal-content">
            <div class="capture-modal-header">
                <div class="capture-modal-title">📸 Preview Capture</div>
                <div class="capture-modal-actions">
                    <button class="modal-btn modal-btn-copy" onclick="copyCaptureToClipboard()">📋 Copy ke Clipboard</button>
                    <button class="modal-btn modal-btn-download" onclick="downloadCapture()">💾 Download PNG</button>
                    <button class="modal-btn modal-btn-close" onclick="closeCaptureModal()">✕ Tutup</button>
                </div>
            </div>
            <img id="capture-preview" class="capture-preview-img" alt="Preview">
        </div>
    </div>

    <!-- ✅ TOAST NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz9QKszz5w9wGstTD57nKH4Gd60eEJqMbXI7aEirvXNn876M8oShhuD9lLrEBmmLZnegQ/exec";
        let tableDownInstance = null;
        let tableNonDownInstance = null;
        let currentArea = "JATIM";
        let lastUpdateTime = null;
        const OFFLINE_THRESHOLD = 5 * 60 * 1000;
        let lastCaptureImage = null;

        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            initTabs();
            fetchPoseidonData(true, 'metro');
            setInterval(() => {
                const activeSubTab = document.querySelector('.sub-tab-btn.active').dataset.subtab;
                fetchPoseidonData(false, activeSubTab);
            }, 30000);
        };

        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tab-' + tab).classList.add('active');
                    
                    if (tab === 'laporan' && !tableDownInstance) {
                        fetchLaporanData();
                    }
                });
            });

            document.querySelectorAll('.sub-tab-btn[data-subtab]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const subtab = btn.dataset.subtab;
                    document.querySelectorAll('.sub-tab-btn[data-subtab]').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.sub-tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('subtab-' + subtab).classList.add('active');
                    
                    if (subtab === 'metro') {
                        fetchPoseidonData(false, 'metro');
                    } else if (subtab === 'radio') {
                        fetchPoseidonData(false, 'radio');
                    }
                });
            });

            document.querySelectorAll('.sub-tab-btn[data-area]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const area = btn.dataset.area;
                    document.querySelectorAll('.sub-tab-btn[data-area]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentArea = area;
                    fetchLaporanData();
                });
            });

            document.getElementById('search-metro').addEventListener('input', (e) => {
                filterTickets('metro', e.target.value);
            });
            document.getElementById('search-radio').addEventListener('input', (e) => {
                filterTickets('radio', e.target.value);
            });
        }

        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Jakarta' };
            document.getElementById('realtime-clock').innerText = now.toLocaleDateString('id-ID', options).replace('pukul', '');
            
            if (lastUpdateTime) {
                const timeDiff = Date.now() - lastUpdateTime;
                if (timeDiff > OFFLINE_THRESHOLD) {
                    setConnectionStatus(false);
                } else {
                    setConnectionStatus(true);
                }
            }
        }

        function setConnectionStatus(isOnline) {
            const dot = document.getElementById('connection-dot');
            const statusText = document.getElementById('connection-status');
            
            if (isOnline) {
                dot.className = 'w-3 h-3 bg-cyan-400 rounded-full live-dot';
                statusText.className = 'text-xs text-cyan-400/70 mt-2 font-mono flex items-center justify-end gap-2';
            } else {
                dot.className = 'w-3 h-3 bg-red-500 rounded-full offline-dot';
                statusText.className = 'text-xs text-red-400/70 mt-2 font-mono flex items-center justify-end gap-2';
                statusText.innerHTML = '<span>️</span><span>Sistem Offline</span>';
            }
        }

        async function fetchPoseidonData(isFirstLoad = false, type = 'metro') {
            try {
                if (isFirstLoad) {
                    document.getElementById('loading').classList.remove('hidden');
                    document.getElementById('main-content').classList.add('hidden');
                }
                
                let url = API_URL + "?t=" + new Date().getTime();
                
                if (type === 'radio') {
                    url = API_URL + "?view=radio&t=" + new Date().getTime();
                } else if (type === 'metro') {
                    url = API_URL + "?view=metro&t=" + new Date().getTime();
                }
                    
                const response = await fetch(url);
                const data = await response.json();
                
                lastUpdateTime = Date.now();
                setConnectionStatus(true);
                
                if (type === 'radio') {
                    renderDashboard(data, 'radio');
                } else {
                    renderDashboard(data, 'metro');
                }
                
                const now = new Date();
                document.getElementById('last-updated').innerText = now.toLocaleTimeString('id-ID');
                
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                setConnectionStatus(false);
                if (isFirstLoad) {
                    const containerId = type === 'radio' ? 'ticket-container-radio' : 'ticket-container-metro';
                    document.getElementById(containerId).innerHTML = `<div class="text-red-400 text-center p-10 glass rounded-xl">Gagal mengambil data: ${error.message}</div>`;
                    showContent();
                }
            }
        }

        async function fetchLaporanData() {
            try {
                const url = API_URL + "?view=laporan&area=" + currentArea + "&t=" + new Date().getTime();
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }
                
                document.getElementById('label-area-down').innerText = `(${currentArea} DOWN)`;
                
                renderTabelDown(data.down);
                renderTabelNonDown(data.nonDown);
            } catch (error) {
                console.error("Gagal mengambil data laporan:", error);
                alert("Gagal memuat data laporan: " + error.message);
            }
        }

        function renderDashboard(data, type) {
            if (data.error) {
                const containerId = type === 'radio' ? 'ticket-container-radio' : 'ticket-container-metro';
                document.getElementById(containerId).innerHTML = `<div class="text-red-400 text-center p-10 glass rounded-xl">${data.error}</div>`;
                showContent();
                return;
            }
            
            const containerId = type === 'radio' ? 'ticket-container-radio' : 'ticket-container-metro';
            const container = document.getElementById(containerId);
            let hasAnyTickets = false;
            container.innerHTML = '';

            data.priorities.forEach(category => {
                const tickets = data.tickets[category];
                if (tickets && tickets.length > 0) {
                    hasAnyTickets = true;
                    let borderClass = "border-l-cyan-500";
                    if (category === 'PREMIUM' || category === 'CRITICAL') borderClass = "border-l-red-500";
                    else if (category === 'MAJOR') borderClass = "border-l-orange-500";

                    let html = `<section>
                        <div class="flex items-center gap-3 mb-4 border-b border-cyan-700/40 pb-2">
                            <h2 class="text-2xl font-bold text-cyan-400 uppercase tracking-widest">${category}</h2>
                            <span class="bg-cyan-900/50 text-cyan-300 text-xs px-3 py-1 rounded-full border border-cyan-700/50">${tickets.length} Tiket Aktif</span>
                        </div><div class="grid gap-4">`;

                    tickets.forEach((ticket, index) => {
                        html += `<div class="glass rounded-xl p-5 hover:bg-blue-900/30 transition-all duration-300 border-l-4 ${borderClass}" data-site="${ticket.siteId}" data-ticket="${ticket.noTiket}">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-cyan-500 font-bold text-lg">${index + 1}.</span>
                                <span class="bg-slate-900/80 text-cyan-300 text-sm font-mono px-3 py-1 rounded-md border border-cyan-800/50">${ticket.siteId}</span>
                            </div>
                            <h3 class="text-lg font-semibold text-white mb-2 break-word">${ticket.noTiket}</h3>
                            <p class="text-cyan-100/80 text-sm mb-4 leading-relaxed break-word">${ticket.headline}</p>
                            <div class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-cyan-200/70 font-mono mb-4 pb-4 border-b border-cyan-700/30">
                                <span>📅 ${ticket.tglOpen}</span>
                                <span class="text-cyan-400 font-bold">⏱️ TTR: ${ticket.ttr}</span>
                            </div>
                            <div class="bg-slate-900/40 rounded-lg p-4 border border-cyan-900/30">
                                <p class="text-xs text-cyan-400 uppercase font-bold mb-2 tracking-wider">Update Terakhir:</p>
                                <p class="text-sm text-cyan-100 italic mb-2 leading-relaxed break-word">"${ticket.update}"</p>
                                <p class="text-xs text-cyan-300/60 flex items-center gap-2">
                                    <span>Tiket Sudah Diupdate Pada :</span>
                                    <strong class="text-cyan-200">${ticket.lastUpd}</strong>
                                </p>
                            </div>
                        </div>`;
                    });
                    html += `</div></section>`;
                    container.innerHTML += html;
                }
            });

            if (!hasAnyTickets) {
                container.innerHTML = `<div class="text-center py-20 glass rounded-2xl border border-cyan-800/30">
                    <h2 class="text-2xl font-bold text-cyan-300 mb-2">Semua Tiket Sudah Clear! 🌊</h2>
                    <p class="text-cyan-200/60">Tidak ada tiket ${type === 'radio' ? 'Radio' : 'Metro'} yang memerlukan penanganan saat ini.</p>
                </div>`;
            }
            showContent();
        }

        function filterTickets(type, searchTerm) {
            const containerId = type === 'radio' ? 'ticket-container-radio' : 'ticket-container-metro';
            const container = document.getElementById(containerId);
            const tickets = container.querySelectorAll('[data-site]');
            
            const term = searchTerm.toLowerCase();
            
            tickets.forEach(ticket => {
                const siteId = ticket.getAttribute('data-site').toLowerCase();
                const noTiket = ticket.getAttribute('data-ticket').toLowerCase();
                
                if (siteId.includes(term) || noTiket.includes(term)) {
                    ticket.style.display = 'block';
                } else {
                    ticket.style.display = 'none';
                }
            });
        }

        function renderTabelDown(data) {
            if (tableDownInstance) {
                tableDownInstance.destroy();
                $('#table-down').empty();
            }
            
            const columns = [
                { title: "Layanan", data: "layanan" },
                { title: "Sevr", data: "sevr" },
                { title: "WZ", data: "wz" },
                { title: "District", data: "district" },
                { title: "Area", data: "area" },
                { title: "No Tiket", data: "noTiket" },
                { title: "Headline", data: "headline", className: "break-word" },
                { title: "Status", data: "status" },
                { title: "Update", data: "update", className: "break-word" },
                { title: "Tglopen", data: "tglopen" },
                { 
                    title: "Ttr", 
                    data: "ttr",
                    render: function(data) {
                        const cls = data >= 8 ? 'ttr-high' : 'ttr-low';
                        return `<span class="${cls}">${data}</span>`;
                    }
                }
            ];

            tableDownInstance = $('#table-down').DataTable({
                data: data,
                columns: columns,
                pageLength: 10,
                order: [[10, 'desc']],
                autoWidth: true,
                scrollX: false, // ✅ TANPA SCROLL HORIZONTAL
                dom: '<"flex justify-between items-center mb-2"lf>rtip',
                buttons: [
                    { extend: 'copy', text: 'Copy', className: 'dt-button' },
                    { extend: 'excel', text: 'Excel', className: 'dt-button' }
                ],
                language: {
                    search: "Search:",
                    lengthMenu: "Show _MENU_ entries",
                    info: "Showing _START_ to _END_ of _TOTAL_ entries",
                    paginate: { previous: "Previous", next: "Next" }
                }
            });
        }

        function renderTabelNonDown(data) {
            if (tableNonDownInstance) {
                tableNonDownInstance.destroy();
                $('#table-nondown').empty();
            }
            
            const columns = [
                { title: "Layanan", data: "layanan" },
                { title: "Sevr", data: "sevr" },
                { title: "WZ", data: "wz" },
                { title: "District", data: "district" },
                { title: "Area", data: "area" },
                { title: "No Tiket", data: "noTiket" },
                { title: "Headline", data: "headline", className: "break-word" },
                { title: "Status", data: "status" },
                { title: "Update", data: "update", className: "break-word" },
                { title: "Tglopen", data: "tglopen" },
                { 
                    title: "Ttr", 
                    data: "ttr",
                    render: function(data) {
                        const cls = data >= 8 ? 'ttr-high' : 'ttr-low';
                        return `<span class="${cls}">${data}</span>`;
                    }
                }
            ];

            tableNonDownInstance = $('#table-nondown').DataTable({
                data: data,
                columns: columns,
                pageLength: 10,
                order: [[10, 'desc']],
                autoWidth: true,
                scrollX: false, // ✅ TANPA SCROLL HORIZONTAL
                dom: '<"flex justify-between items-center mb-2"lf>rtip',
                buttons: [
                    { extend: 'copy', text: 'Copy', className: 'dt-button' },
                    { extend: 'excel', text: 'Excel', className: 'dt-button' }
                ],
                language: {
                    search: "Search:",
                    lengthMenu: "Show _MENU_ entries",
                    info: "Showing _START_ to _END_ of _TOTAL_ entries",
                    paginate: { previous: "Previous", next: "Next" }
                }
            });
        }

        function showContent() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }
        
        // =============================================
        // ✅ FUNGSI CAPTURE LAPORAN (HANYA WAKTU DI KANAN, TANPA JUDUL DI KIRI)
        // =============================================
        function captureBothTables() {
            const wrapper = document.getElementById('capture-wrapper');
            const header = wrapper.querySelector('.capture-main-header');
            const timestampInline = wrapper.querySelector('.capture-timestamp-inline');
            
            // ✅ Format waktu manual agar persis: "Minggu, 27 September 2026 pukul 12.16.39"
            const now = new Date();
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            
            const dayName = days[now.getDay()];
            const date = now.getDate();
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const finalDate = `${dayName}, ${date} ${monthName} ${year} pukul ${hours}.${minutes}.${seconds}`;
            
            if (timestampInline) {
                timestampInline.textContent = finalDate;
            }
            
            // Tampilkan header (hanya berisi waktu di kanan)
            header.style.display = 'block';
            
            // Scroll ke atas wrapper agar capture dimulai dari atas
            wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Tunggu sebentar agar scroll dan DOM update sempurna
            setTimeout(() => {
                html2canvas(wrapper, {
                    backgroundColor: '#0f172a',
                    scale: 2, // High resolution (2x)
                    useCORS: true,
                    logging: false,
                    scrollX: 0,
                    scrollY: 0,
                    windowWidth: wrapper.scrollWidth,
                    windowHeight: wrapper.scrollHeight // ✅ KUNCI: Memaksa capture seluruh tinggi konten
                }).then(canvas => {
                    // Sembunyikan kembali header
                    header.style.display = 'none';
                    
                    // Simpan gambar
                    lastCaptureImage = canvas.toDataURL('image/png');
                    
                    // Tampilkan preview
                    document.getElementById('capture-preview').src = lastCaptureImage;
                    document.getElementById('capture-modal').classList.add('active');
                    
                    // Auto copy ke clipboard
                    copyCaptureToClipboard();
                }).catch(err => {
                    header.style.display = 'none';
                    showToast(' Gagal capture: ' + err.message, true);
                });
            }, 300);
        }

        async function copyCaptureToClipboard() {
            if (!lastCaptureImage) {
                showToast('❌ Tidak ada gambar untuk di-copy', true);
                return;
            }
            
            try {
                const response = await fetch(lastCaptureImage);
                const blob = await response.blob();
                
                await navigator.clipboard.write([
                    new ClipboardItem({
                        'image/png': blob
                    })
                ]);
                
                showToast('✅ Berhasil di-copy! Langsung paste (Ctrl+V) di WhatsApp');
            } catch (err) {
                showToast('⚠️ Copy gagal, silakan download manual', true);
                downloadCapture();
            }
        }

        function downloadCapture() {
            if (!lastCaptureImage) {
                showToast('❌ Tidak ada gambar', true);
                return;
            }
            
            const link = document.createElement('a');
            link.download = `Laporan_CNOP_${currentArea}_${new Date().getTime()}.png`;
            link.href = lastCaptureImage;
            link.click();
            
            showToast('⬇️ Gambar berhasil di-download');
        }

        function closeCaptureModal() {
            document.getElementById('capture-modal').classList.remove('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Tutup modal dengan klik di luar
        document.getElementById('capture-modal').addEventListener('click', (e) => {
            if (e.target.id === 'capture-modal') {
                closeCaptureModal();
            }
        });

        // Shortcut keyboard: ESC untuk tutup modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCaptureModal();
            }
        });
    </script>
